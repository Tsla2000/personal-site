<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="美股观察卡片网站演示版：可切换 NVDA/AVGO/MU/NBIS/TSLA 查看演示行情，自选股保存在浏览器本地，可直接交互体验。" />
<link rel="canonical" href="https://promangofund.com/demo/stock-card.html" />
<title>美股观察卡片 · 网站演示版</title>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f5f5f4;
    --text: #141413;
    --text2: #6b6b68;
    --border: #e3e3e0;
    --up: #1a7f37;
    --down: #cf222e;
    --accent: #141413;
    --accent-text: #ffffff;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #30302e;
      --bg2: #3a3a38;
      --text: #faf9f5;
      --text2: #a3a39e;
      --border: #4a4a48;
      --accent: #faf9f5;
      --accent-text: #141413;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 12px 24px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.4;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .page-title { font-size: 17px; font-weight: 700; margin: 4px 2px 2px; }
  .page-sub { font-size: 12px; color: var(--text2); margin: 0 2px 12px; }
  .tabs { display: flex; gap: 8px; margin: 0 2px 12px; flex-wrap: wrap; }
  .tabs button {
    min-height: 44px; padding: 0 16px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--bg2); color: var(--text);
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: ui-monospace, monospace; letter-spacing: 0.5px;
  }
  .tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  .card { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; background: var(--bg); }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .row:last-of-type { margin-bottom: 0; }
  .sym { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  .price { font-size: 20px; font-weight: 700; font-family: ui-monospace, monospace; }
  .chg { font-size: 14px; font-weight: 600; font-family: ui-monospace, monospace; }
  .chg.up { color: var(--up); } .chg.down { color: var(--down); }
  .note { font-size: 12px; color: var(--text2); }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button {
    flex: 1; min-height: 44px; border-radius: var(--radius);
    border: 1px solid transparent; cursor: pointer;
    font-size: 14px; font-weight: 600;
    background: var(--accent); color: var(--accent-text);
  }
  .actions button.ghost { background: var(--bg2); color: var(--text); border-color: var(--border); }
  .toast {
    margin-top: 10px; padding: 8px 12px; border-radius: var(--radius);
    background: var(--bg2); color: var(--text); font-size: 13px; text-align: center;
  }
  .watch { margin: 12px 2px 0; font-size: 12px; color: var(--text2); }
  .watch b { color: var(--text); font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-title">美股观察卡片</div>
  <p class="page-sub">MCP App 网站演示版 · 演示数据，非实时行情</p>
  <div class="tabs" role="group" aria-label="选择股票" id="tabs"></div>
  <div class="card" id="card"></div>
  <div class="watch" id="watch"></div>
</div>
<script>
(function () {
  "use strict";
  // 演示数据（非实时）。与 MCP 版 demo 保持一致的确定性 mock。
  var QUOTES = {
    NVDA: { price: 187.42, change: 2.31, changePct: 1.25 },
    AVGO: { price: 342.18, change: 4.06, changePct: 1.20 },
    MU:   { price: 201.55, change: -1.92, changePct: -0.94 },
    NBIS: { price: 94.28, change: 3.35, changePct: 3.68 },
    TSLA: { price: 448.32, change: -6.14, changePct: -1.35 }
  };
  var SYMBOLS = Object.keys(QUOTES);
  var LS_KEY = "site-watchlist:v1";

  var current = "NVDA";
  var watchlist = [];
  try { watchlist = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) { watchlist = []; }

  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(watchlist)); } catch (e) {}
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var tabsEl = document.getElementById("tabs");
  var cardEl = document.getElementById("card");
  var watchEl = document.getElementById("watch");
  var toastTimer = null;

  function toast(msg) {
    var old = cardEl.querySelector(".toast");
    if (old) old.remove();
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    cardEl.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.remove(); }, 2200);
  }

  function renderTabs() {
    tabsEl.innerHTML = "";
    SYMBOLS.forEach(function (sym) {
      var b = document.createElement("button");
      b.textContent = sym;
      b.setAttribute("aria-pressed", sym === current ? "true" : "false");
      b.onclick = function () { current = sym; renderTabs(); renderCard(); };
      tabsEl.appendChild(b);
    });
  }

  function renderWatch() {
    watchEl.innerHTML = watchlist.length
      ? "我的自选：<b>" + watchlist.map(esc).join("</b> · <b>") + "</b>"
      : "我的自选：暂无，点击「加入自选」添加（只保存在本浏览器）";
  }

  function renderCard() {
    var q = QUOTES[current];
    var up = q.change >= 0;
    var sign = up ? "+" : "";
    var inList = watchlist.indexOf(current) !== -1;
    cardEl.innerHTML =
      '<div class="row"><div class="sym">' + esc(current) + '</div>' +
      '<div class="price">$' + q.price.toFixed(2) + '</div></div>' +
      '<div class="row"><div class="chg ' + (up ? "up" : "down") + '">' +
      sign + q.change.toFixed(2) + " (" + sign + q.changePct.toFixed(2) + "%)</div>" +
      '<div class="note">演示数据 · 非实时行情</div></div>' +
      '<div class="actions"><button id="btn-add" class="' + (inList ? "ghost" : "") + '">' +
      (inList ? "已在自选 · 点击移除" : "加入自选") + '</button>' +
      '<button id="btn-refresh" class="ghost">刷新</button></div>';

    document.getElementById("btn-add").onclick = function () {
      var i = watchlist.indexOf(current);
      if (i === -1) {
        watchlist.push(current);
        toast(current + " 已加入自选");
      } else {
        watchlist.splice(i, 1);
        toast(current + " 已从自选中移除");
      }
      save();
      renderCard();
      renderWatch();
    };
    document.getElementById("btn-refresh").onclick = function () {
      renderCard();
      toast("已是最新演示数据");
    };
  }

  renderTabs();
  renderCard();
  renderWatch();
})();
</script>
</body>
</html>
