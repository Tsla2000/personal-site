name: Deploy COS mirror (WeChat)

# WeChat-shareable mirror on Tencent COS (*.myqcloud.com is never blocked by WeChat).
# GitHub Pages stays the canonical site; this job syncs the same build to COS.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cos-mirror
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run docs:build
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install COS SDK
        run: pip install cos-python-sdk-v5
      - name: Sync to COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: pro-site-1501039154
          COS_REGION: ap-beijing
        run: python3 scripts/sync-cos.py
